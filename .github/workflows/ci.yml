name: Conformance
on:
  push:
    branches: ['codex/**', main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python tools/check_archive.py
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s tests -v
        working-directory: prototype/v0.1
      - run: python prototype/v0.1/gptfs.pyz verify prototype/v0.1/sample/research.gpt --checkpoint prototype/v0.1/sample/checkpoint.json
